# A compass ribbon.
#
# length is how many columns wide the strip is; every icon is baked at ceil(length/2)
# sizes so it can shrink towards the edges. scale-equation drives that shrinking:
# 1 at the centre, falling away by t/30 per step outwards.
#
# Лента компаса. length - ширина полосы в колонках; каждая иконка запекается в
# ceil(length/2) размерах, чтобы уменьшаться к краям. scale-equation задаёт это
# уменьшение: 1 в центре и меньше на t/30 за шаг к краю.

simple:
  length: 30
  space: 2
  scale: 2
  scale-equation: "1 - t/30"
  apply-opacity: true
  file:
    n:
      name: compass_cardinal.png
      scale: 1
    e:
      name: compass_cardinal.png
      scale: 0.8
    s:
      name: compass_cardinal.png
      scale: 0.8
    w:
      name: compass_cardinal.png
      scale: 0.8
    ne:
      name: compass_ordinal.png
      scale: 1
    nw:
      name: compass_ordinal.png
      scale: 1
    se:
      name: compass_ordinal.png
      scale: 1
    sw:
      name: compass_ordinal.png
      scale: 1
    chain:
      name: compass_chain.png
      scale: 0.7
      opacity: 0.6
    point:
      name: compass_marker.png
      scale: 1

