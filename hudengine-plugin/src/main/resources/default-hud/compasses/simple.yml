#    font: small       # Font used for the distance text / Шрифт текста
#    scale: 1          # Text size; font scale x this, under 5 px is unreadable / Размер текста; масштаб шрифта x это, меньше 5 px нечитаемо
#    color: white      # Text color / Цвет текста.
#    x: 0              # Horizontal offset / Смещение по X
