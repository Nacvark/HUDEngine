# Сообщения HUDEngine, русский.
#
# Скопируйте этот файл в messages.yml в папке плагина, чтобы что-то изменить.
# Пропущенные строки берутся из текста ниже, поэтому в своём файле можно
# оставить только те, которые вы правите.
#
# Цвет намеренно редкий: префикс, слова-состояния и ошибки. Всё остальное
# белое, чтобы глаз цеплялся за то, что изменилось.
#
# Форматирование - устаревшие коды: &a зелёный, &f белый, &c красный,
# &e жёлтый, &7 серый. Значения в фигурных скобках подставляет плагин.

prefix: "&a[HUDEngine]&f "

console:
  disabled: "Выключен в config.yml"
  compiled: "Пак собран за {ms} мс в {path}"
  running: "Запущен с худами: {huds}"
  compile-failed: "&cКомпиляция не удалась.&f HUD не запущен."
  reload-failed: "&cПерезагрузка не удалась.&f Продолжает работать прежняя модель."
  no-huds: "Ни одного худа не скомпилировано. Положите папки huds/, layouts/ и images/ рядом с config.yml"
  papi-found: "PlaceholderAPI найден, ключи papi: доступны"
  papi-missing: "Худ использует плейсхолдеры papi:, но PlaceholderAPI не установлен - значения будут пустыми"
  skins-offline: "У игроков нет текстуры скина. Головы будут рисоваться встроенным лицом."
  shadow-unsupported: "Сервер старше, чем управление тенью на компонент (клиент 1.21.4), поэтому картинки и головы будут рисоваться с ванильной тенью."
  glyph-missing: "Нет глифа для {codepoint} ('{character}'). Добавьте его язык в include шрифта."
  unknown-default-hud: "В huds.default указан \"{hud}\", которого нет ни в одном конфиге. Пропускаю."
  starter-written: "Стартовый HUD записан в {path}. Правьте его или удалите папки и поставьте starter-hud: false, чтобы он не появлялся снова. См. README.txt."
  starter-empty: "В этой сборке нет стартового HUD, поэтому он не записан"
  starter-failed: "Не удалось записать стартовый HUD: {error}"
  papi-mismatch: "PlaceholderAPI установлен, но его API не такой, какого ожидает эта версия HUDEngine - ключи papi: отключены"
  skin-failed: "Не удалось загрузить скин для {player}, используется запасное лицо: {error}"
  tick-failed: "Не удалось собрать HUD для игрока {player}"
  boss-bar-line-range: "pack.boss-bar-line должен быть от 1 до {max}, поэтому {value} читается как {fallback}"
  level-text-moved: "pack.hide-vanilla-level-text переехал в hide-vanilla-hud.level-text и на прежнем месте игнорируется"
  unknown-hidden-element: "hide-vanilla-hud: \"{key}\" движок скрывать не умеет. Известные элементы: {known}"
  points-unreadable: "Не удалось прочитать точки компаса из {path}: {error}"
  compass-provider-failed: "Провайдер точек компаса \"{id}\" завершился с ошибкой: {error}"
  delivery-unknown: "В resource-pack.delivery указано \"{value}\" - это не none, url и не host; считаю за none"
  pack-missing: "Собранного пака нет по пути {path}, раздача отключена"
  pack-unreadable: "Не удалось прочитать собранный пак для раздачи: {error}"
